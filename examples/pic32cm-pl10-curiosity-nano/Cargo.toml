[package]
name = "pic32cm-pl10-curiosity-nano"
description = "Board support for Microchip's PIC32CM PL10 Curiosity Nano (EV10P22A), with pic32c-hal's PL10 bench programs as examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The bench programs, as examples. Bare metal: no test harness on the target.
[[example]]
name = "blink"
test = false
bench = false

[[example]]
name = "uart_bridge"
test = false
bench = false

[[example]]
name = "uart_echo"
test = false
bench = false

[[example]]
name = "dma"
test = false
bench = false

[[example]]
name = "uart_dma"
test = false
bench = false

[[example]]
name = "uart_ring"
test = false
bench = false

[[example]]
name = "spi"
test = false
