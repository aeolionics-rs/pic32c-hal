[features]
# The board, exactly one: the PIC32CK SG01 Curiosity Ultra (EV33A17A), or the
# PIC32CK GC01 Curiosity Ultra.
sg01 = ["pic32c-hal/pic32ck2051sg01144"]
gc01 = ["pic32c-hal/pic32ck2051gc01144"]
# eth_https and crypto_bench: the TLS stack below (`examples/common/tls.rs`,
# rustls on embassy-net). It needs a global allocator, so it's off for the
# other examples.
tls = ["dep:embedded-alloc", "dep:getrandom", "dep:p256", "dep:p256-cortex-m4", "dep:pkcs8", "dep:primeorder", "dep:rand-core-06", "dep:rustls", "dep:rustls-rustcrypto", "dep:salty", "dep:sec1", "dep:sha2", "dep:x25519-dalek"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
critical-section = "1.2.0"
pic32c-hal = { path = "../../pic32c-hal", features = ["rt", "time-driver", "unstable-pac"] }
# eth_https's and crypto_bench's TLS stack, behind `tls`: Cargo has no
# optional dev-dependencies, and these need a global allocator (and
# arm-none-eabi-gcc), so the other examples go without.
embedded-alloc = { version = "0.7.0", default-features = false, features = ["tlsf"], optional = true }
# TLS (the eth_https spike): rustls's unbuffered API with RustCrypto. Its
# getrandom calls go to the TRNG through the custom backend
# (`.cargo/config.toml` sets `getrandom_backend="custom"`).
getrandom = { version = "0.4.3", default-features = false, features = ["sys_rng"], optional = true }
rustls = { version = "0.23.46", default-features = false, optional = true }
rustls-rustcrypto = { version = "0.1.0-pre.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
# For `tls::provider`'s key exchanges (rustls-rustcrypto's own are private).
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "precomputed-tables"], optional = true }
sha2 = { version = "0.11.1", default-features = false, optional = true }
# P256-Cortex-M4 (assembly, MIT): fast P-256 ECDSA and ECDH. Its C and
# assembly build with arm-none-eabi-gcc, which must be on the PATH.
p256-cortex-m4 = { version = "0.1.0-alpha.6", default-features = false, optional = true }
rand-core-06 = { package = "rand_core", version = "0.6.4", default-features = false, optional = true }
# salty: X25519 with Bjoern Haase's Cortex-M4 field arithmetic (CC0;
# salty is MIT OR Apache-2.0); it links a prebuilt archive of that assembly.
salty = { version = "0.3.0", default-features = false, optional = true }
# Parsing the PKCS #8 / SEC1 private key without any curve arithmetic.
pkcs8 = { version = "0.11.0", default-features = false, optional = true }
sec1 = { version = "0.8.1", default-features = false, features = ["der"], optional = true }
# p256's precomputed base-point table (~25 KB of RAM, built on first use)
# needs a once-cell; on no_std that's critical-section.
primeorder = { version = "0.14.0", default-features = false, features = ["critical-section"], optional = true }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"], optional = true }

# What the examples use.
[dev-dependencies]
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false, features = ["device", "class-cdc-acm", "class-cdc-ncm"] }
embedded-hal = "1.0.0"
# The bench programs' I2C sensors, on embedded-hal-async.
# bme280's blocking driver: its async one needs nightly Rust.
bme280 = "0.5.1"
sht4x = { version = "0.2.0", features = ["embedded-hal-async"] }
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
# The HAL again, with the features the examples use beyond the library's.
pic32c-hal = { path = "../../pic32c-hal", features = ["can-hal", "eth", "exti", "rt", "time-driver", "usb", "usbhs", "unstable-pac"] }
panic-halt = "1.0.0"
# Our fork's `aeolionics` branch, as pic32c-hal's `can-hal` feature takes it.
can-hal = { version = "0.4.3", git = "https://github.com/aeolionics-rs/can-hal-rs", branch = "aeolionics", package = "can-hal-rs", default-features = false }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "icmp-ping-reply", "ipv4", "ipv6", "medium-ethernet", "multicast", "slaac", "tcp", "tcp-listener", "udp"] }
# The stack's tables are fixed at build time by xarxa's features (its
# defaults: 4 TCP sockets, 2 listeners, 4 UDP sockets, 4 addresses a
# interface, 2 interfaces). usbhs_ncm listens on three ports; eth_http
# serves three connections at once (two HTTP, one echo); eth_https's UDP
# sockets are SNTP's, mDNS's and the DNS client's.
xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "8f6f33b131deb9ff3290e0e01079537e1ed7b2ad", default-features = false, features = ["tcp-socket-count-4", "tcp-listener-count-3", "udp-socket-count-4"] }
static_cell = "2.1.1"
picoserve = { version = "0.21.0", default-features = false, features = ["embassy"] }
heapless = "0.9"
embedded-io-async = "0.7"
embedded-io = "0.7"
sntpc = { version = "0.11.0", default-features = false }
# mDNS (the `mdns` module).
edge-mdns = { version = "0.8.0", default-features = false, features = ["io"] }
edge-nal = "0.7.0"
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-ipv4", "proto-ipv6", "udp"] }
rand-core-010 = { package = "rand_core", version = "0.10.1", default-features = false }

[lints]
workspace = true
