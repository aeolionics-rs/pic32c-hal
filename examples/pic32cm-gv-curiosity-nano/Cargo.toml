[package]
name = "pic32cm-gv-curiosity-nano"
description = "Board support for Microchip's PIC32CM GV-Value Line Curiosity Nano+ Touch (EV80D90A), with pic32c-hal's GV00 bench programs as examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The bench programs, as examples. Bare metal: no test harness on the target.
[[example]]
name = "blink"
test = false
bench = false

[[example]]
name = "uart_echo"
test = false
bench = false

[[example]]
name = "spi"
test = false
bench = false

[[example]]
name = "i2c"
test = false
bench = false

[[example]]
name = "flash"
test = false
bench = false

[[example]]
name = "flash_async"
test = false
bench = false

[[example]]
name = "watchdog"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
critical-section = "1.2.0"
embassy-time = "0.5.1"
pic32c-hal = { path = "../../pic32c-hal", features = ["pic32cm3204gv00064", "rt", "time-driver", "unstable-pac"] }

# What the examples use.
[dev-dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
# The bench programs' I2C sensor, on embedded-hal-async.
sht4x = { version = "0.2.0", features = ["embedded-hal-async"] }
panic-halt = "1.0.0"
static_cell = "2.1.1"

[lints]
workspace = true
