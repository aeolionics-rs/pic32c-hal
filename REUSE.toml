version = 1

# Files that can't carry a header, or that Cargo writes.
[[annotations]]
path = [
    "**/Cargo.toml",
    "Cargo.lock",
    "**/.gitignore",
    "**/*.md",
    "**/memory.x",
]
SPDX-FileCopyrightText = "2026 Aeolionics, LLC"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The bench certificate and its key, made for the examples (certs/README.md).
[[annotations]]
path = "examples/*/certs/*"
SPDX-FileCopyrightText = "2026 Aeolionics, LLC"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The PACs, generated by svd2rust from Microchip's SVDs (see each svd/LICENSE.txt).
[[annotations]]
path = [
    "pac/*/src/**",
    "pac/*/build.rs",
    "pac/*/device.x",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Microchip Technology Inc."
SPDX-License-Identifier = "Apache-2.0"
