[workspace]
resolver = "3"
members = ["examples/pic32ck-curiosity-ultra", "examples/pic32cm-gv-curiosity-nano", "examples/pic32cm-pl10-curiosity-nano", "examples/pic32cm-sg00-curiosity-pro","pac/pic32ck-gc01-pac", "pac/pic32ck-sg01-pac", "pac/pic32cm-gv00-pac", "pac/pic32cm-pl10-pac", "pac/pic32cm-sg00-pac", "pic32c-hal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# embassy main uses core::mem::DropGuard (embassy-embedded-hal, and
# embassy-net with dns), stable from 1.100.
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.dev]
# Symbols don't take flash space.
debug = true
opt-level = "s"

[profile.release]
debug = true
opt-level = "s"
lto = "fat"
codegen-units = 1

# Spike: embassy `main`, where embassy-net runs on xarxa instead of smoltcp.
# Every embassy crate the workspace reaches is patched to the same revision:
# a crates.io embassy-time-driver beside a git one is two crates with the
# same `links`, which Cargo refuses.
[patch.crates-io]
# Not on crates.io yet (only a 0.0.0 placeholder): the patch is what provides
# the 0.1.0 pic32c-hal's `embassy-crypto-rng` names.
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "ce40ea9c735565be8ddb78d52f7f8fc3177501ef" }

# Ported to embassy-net on xarxa, in our forks: picoserve 0.21.0 (its
# `embassy` glue on the new TcpSocket and TcpListener, sammhicks/picoserve#122)
# and edge-nal-embassy (UDP and DNS; TCP not yet). `.cargo/local.toml` can
# point these at checkouts beside this repository.
picoserve = { git = "https://github.com/aeolionics-contrib/picoserve", branch = "xarxa-0.21" }
edge-nal-embassy = { git = "https://github.com/aeolionics-contrib/edge-net", branch = "xarxa" }
# edge-nal-embassy takes the fork's edge-nal; this keeps edge-mdns on the same
# one.
edge-nal = { git = "https://github.com/aeolionics-contrib/edge-net", branch = "xarxa" }
