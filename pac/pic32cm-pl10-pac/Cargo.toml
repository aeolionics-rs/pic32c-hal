[package]
name = "pic32cm-pl10-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for the PIC32CM6408PL10048, generated by svd2rust from Microchip's PIC32CM-PL_DFP SVD."
license = "Apache-2.0"
publish = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }
critical-section = { version = "1.2", optional = true }
vcell = "0.1.3"

[features]
rt = ["cortex-m-rt/device"]
