[package]
name = "pic32cm-gv00-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for the PIC32CM3204GV00064, generated by svd2rust from Microchip's PIC32CM-GV_DFP SVD."
license = "Apache-2.0"
publish = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }
critical-section = { version = "1.2", optional = true }
vcell = "0.1.3"

[features]
rt = ["cortex-m-rt/device"]

# Generated code: svd2rust names the OSC32KCTRL register after its peripheral.
[lints.clippy]
module_inception = "allow"
