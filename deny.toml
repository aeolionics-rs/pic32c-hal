# cargo-deny policy: permissive licences only, RustSec advisories, and
# dependencies from crates.io or our own GitHub organisation.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "0BSD",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
# Our libraries; our forks of others' (picoserve, edge-net); embassy main.
github = ["aeolionics-rs", "aeolionics-contrib", "embassy-rs"]
